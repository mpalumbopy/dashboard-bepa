
<script>
const PROXY='https://main.dashboard-bepa.pages.dev/api/jira';
const BASE='https://grupobepa.atlassian.net/browse/';
const CHECK_INTERVAL=20;
const TEAMS={soporte:['jaime','diana','jorge','marcos','leticia'],desarrollo:['kevin','daril','rodrigo','aldo','elias','gustavo','danays','blanca'],infra:['richard','fabian']};
const CLOSED=new Set(['finalizado','finalizada','cancelado','cancelada','done','cerrado','cerrada','closed','resuelto','resuelta','completado','completada','completo','completa','complete','completed','terminado','terminada','cancelled','canceled','implementado','listo','lista']);
const PAUSED=new Set(['en pausa','paused','pause','on hold','suspendido','suspendida','bloqueado','bloqueada','blocked']);
const ENC=new Set(['en curso','in progress','in_progress','en progreso','en proceso','en desarrollo','doing','activo','activa','active','en revisión','en revision','en testing','testing','in review','reviewing','en qa','qa','in qa','análisis','analisis','analysis','planificado','planificada','planned','sprint activo','sprint activa']);
function sCat(n){const l=(n||'').toLowerCase().trim();if(CLOSED.has(l))return'done';if(PAUSED.has(l))return'pau';return ENC.has(l)?'enc':'por'}
function getTeam(d){if(!d)return'sin-asignar';const l=d.toLowerCase().trim();for(const[t,ns]of Object.entries(TEAMS)){if(ns.some(n=>l.startsWith(n)))return t}return'otro'}
function dateStr(d){return d.toISOString().slice(0,10)}
function fmtAgo(iso){if(!iso)return'—';const d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);if(d===0)return'hoy';if(d===1)return'ayer';return`hace ${d}d`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const FIELDS=['summary','status','assignee','project','issuetype','created','updated','priority'];
async function callProxy(jql,max=200,tok=null){const b={jql,fields:FIELDS,maxResults:max};if(tok)b.nextPageToken=tok;const r=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function fetchAll(jql){let issues=[],token=null;do{const d=await callProxy(jql,200,token);issues=issues.concat(d.issues||[]);token=d.nextPageToken||null;if(issues.length>=1000)break}while(token);return issues}
let activeIssues=[],activeArea=null,activeTab='all',checkTimer=null,checkIn=CHECK_INTERVAL;
const prev={};

/* ── Bull Queue labels ─────────────────────────────────────────────────── */
const Q_LABELS={
  generarXml:'Generar XML',firmaXml:'Firma XML',envioSifen:'Envío SIFEN',
  consultaSifen:'Consulta SIFEN',generarXmlEventos:'Generar XML Eventos',
  firmaXmlEventos:'Firma XML Eventos',envioEventoSifen:'Envío Evento SIFEN',
  jsonRespuestaDocumentos:'JSON Respuesta Docs',jsonRespuestaEventos:'JSON Respuesta Eventos',
  envioDocumentoCore:'Envío Doc. Core',consultaDocumentoCore:'Consulta Doc. Core',
  RetornoDocumentoCore:'Retorno Doc. Core',envioEventoCore:'Envío Evento Core',
  consultaEventoCore:'Consulta Evento Core',RetornoEventoCore:'Retorno Evento Core'
};

function renderQueues(queues,cid){
  const el=document.getElementById(cid);
  if(!el)return;
  if(!queues||!queues.length){el.innerHTML='<div class="bull-empty">Sin datos</div>';return}
  el.innerHTML=queues.map(q=>{
    const c=q.counts,label=Q_LABELS[q.name]||q.name;
    let badges='';
    if(c.active>0)badges+=`<span class="qb qb-act">⚡${c.active}</span>`;
    if(c.waiting>0)badges+=`<span class="qb qb-wait">⏳${c.waiting}</span>`;
    if(c.failed>0)badges+=`<span class="qb qb-err">✗${c.failed}</span>`;
    if(!badges)badges=`<span class="qb qb-ok">✓${(c.completed||0).toLocaleString('es')}</span>`;
    return`<div class="q-row"><div class="q-name">${label}</div><div class="q-badges">${badges}</div></div>`;
  }).join('');
}

async function loadBullData(){
  try{
    const[cr,ctr]=await Promise.allSettled([
      fetch('/api/bull-core').then(r=>r.json()),
      fetch('/api/bull-controller').then(r=>r.json())
    ]);
    if(cr.status==='fulfilled')renderQueues(cr.value.queues,'bull-core');
    else document.getElementById('bull-core').innerHTML='<div class="bull-empty" style="color:var(--r)">Error al cargar</div>';
    if(ctr.status==='fulfilled')renderQueues(ctr.value.queues,'bull-ctrl');
    else document.getElementById('bull-ctrl').innerHTML='<div class="bull-empty" style="color:var(--r)">Error al cargar</div>';
  }catch(e){console.error('Bull error:',e)}
}

async function loadData(){
  setLoading(true);
  try{
    const today=new Date(),todayStr=dateStr(today),ms=dateStr(new Date(today.getFullYear(),today.getMonth(),1));
    const[active,mes,fin]=await Promise.all([fetchAll('statusCategory != Done ORDER BY updated DESC'),fetchAll(`created >= "${ms}" ORDER BY created DESC`),fetchAll(`statusCategory = Done AND updated >= "${ms}" ORDER BY updated DESC`)]);
    activeIssues=active;
    let nSin=0,nSop=0,nDev=0,nInf=0;
    for(const i of active){const t=getTeam(i.fields?.assignee?.displayName||null);if(t==='sin-asignar')nSin++;else if(t==='soporte')nSop++;else if(t==='desarrollo')nDev++;else if(t==='infra')nInf++}
    setCount('n-sin',nSin);setCount('n-sop',nSop);setCount('n-dev',nDev);setCount('n-inf',nInf);
    setCount('n-hoy',mes.filter(i=>(i.fields?.created||'').startsWith(todayStr)).length);
    setCount('n-mes',mes.length);setCount('n-fin',fin.length);
    const now=new Date().toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('last-upd').textContent=`Actualizado: ${now}  ·  ${active.length} tickets activos`;
    document.getElementById('foot').textContent=`grupobepa.atlassian.net  ·  Total activos: ${active.length}  ·  ${now}`;
    if(activeArea)renderPanel(activeArea,activeTab);
    const fl=document.getElementById('flash');fl.style.opacity='1';setTimeout(()=>fl.style.opacity='0',2500);
  }catch(e){console.error(e);document.getElementById('last-upd').textContent='Error al conectar con Jira — reintentando...';}
  setLoading(false);
  loadBullData();
}
function setLoading(on){document.querySelectorAll('.card-num').forEach(el=>on?el.classList.add('loading'):el.classList.remove('loading'))}
function setCount(id,n){const el=document.getElementById(id);if(!el)return;const p=prev[id];prev[id]=n;el.textContent=n;el.classList.remove('loading');if(p!==undefined&&p!==n){el.classList.remove('num-changed');void el.offsetWidth;el.classList.add('num-changed');setTimeout(()=>el.classList.remove('num-changed'),600)}}
function startPolling(){
  clearInterval(checkTimer);checkIn=CHECK_INTERVAL;
  checkTimer=setInterval(()=>{
    checkIn--;const el=document.getElementById('countdown');if(el)el.textContent=checkIn+'s';
    if(checkIn<=0){checkIn=CHECK_INTERVAL;document.getElementById('check-status').textContent='🔄 actualizando...';loadData().then(()=>document.getElementById('check-status').textContent='● en vivo').catch(()=>document.getElementById('check-status').textContent='⚠ error')}
  },1000);
}
const AREA_META={'sin-asignar':{label:'Sin Asignar',accent:'#ef4444',id:'card-sin'},soporte:{label:'Soporte',accent:'#3b82f6',id:'card-sop'},desarrollo:{label:'Desarrollo',accent:'#a855f7',id:'card-dev'},infra:{label:'Infraestructura',accent:'#10b981',id:'card-inf'}};
function showArea(area){if(activeArea===area){closePanel();return}document.querySelectorAll('.card.clickable').forEach(c=>c.classList.remove('active-card'));const m=AREA_META[area];if(m)document.getElementById(m.id)?.classList.add('active-card');activeArea=area;activeTab='all';renderPanel(area,'all');document.getElementById('panel').classList.add('open');document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'})}
function closePanel(){activeArea=null;document.getElementById('panel').classList.remove('open');document.querySelectorAll('.card.clickable').forEach(c=>c.classList.remove('active-card'))}
function renderPanel(area,tab){
  const m=AREA_META[area];if(!m)return;
  document.getElementById('panel-title').textContent=m.label+' — Tickets Activos';
  document.getElementById('panel-title').style.color=m.accent;
  const issues=activeIssues.filter(i=>getTeam(i.fields?.assignee?.displayName||null)===area);
  const cats={enc:0,por:0,pau:0,done:0};for(const i of issues)cats[sCat(i.fields?.status?.name)]++;
  const tabs=[{id:'all',cls:'t-all',lbl:'Todos',n:issues.length},{id:'enc',cls:'t-enc',lbl:'● En Curso',n:cats.enc},{id:'por',cls:'t-por',lbl:'● Por Hacer',n:cats.por},...(cats.pau?[{id:'pau',cls:'t-pau',lbl:'⏸ En Pausa',n:cats.pau}]:[]),...(cats.done?[{id:'done',cls:'t-done',lbl:'✅ Finalizadas',n:cats.done}]:[])];
  document.getElementById('panel-tabs').innerHTML=tabs.map(t=>`<span class="tab ${t.cls}${tab===t.id?' on':''}" onclick="setTab('${t.id}')">${t.lbl}<span class="tc">${t.n}</span></span>`).join('');
  const shown=tab==='all'?issues:issues.filter(i=>sCat(i.fields?.status?.name)===tab);
  if(!shown.length){document.getElementById('panel-body').innerHTML='<div class="empty">No hay tickets en esta categoría</div>';return}
  const rows=shown.map(i=>{const f=i.fields,sn=f?.status?.name||'',cat=sCat(sn),bc={enc:'b-enc',por:'b-por',pau:'b-pau',done:'b-done'}[cat]||'b-por';return`<tr><td class="tbl-key"><a href="${BASE}${i.key}" target="_blank">${i.key}</a></td><td class="tbl-sum">${esc(f?.summary||'—')}</td><td><span class="badge ${bc}">${esc(sn)}</span></td><td class="tbl-who">${f?.assignee?.displayName||'<em style="color:var(--r)">Sin asignar</em>'}</td><td class="tbl-proj">${f?.project?.key||'—'}</td><td class="tbl-date">${fmtAgo(f?.updated)}</td></tr>`}).join('');
  document.getElementById('panel-body').innerHTML=`<table class="tbl"><thead><tr><th>Ticket</th><th>Descripción</th><th>Estado</th><th>Asignado</th><th>Proyecto</th><th>Actualizado</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function setTab(t){activeTab=t;renderPanel(activeArea,t)}
loadData().then(startPolling);
</script>
</body>
</html>
